upstream tornado {
    server 127.0.0.1:8000;
}

upstream myreader {
    server 127.0.0.1:9100;
}

# 多层nginx的情况下，X-Scheme可能已经被设置过了，需要判断下
map $http_x_scheme $req_scheme {
    default   $http_x_scheme;
    ""        $scheme;
}

# WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 【安全优化 1】通过 map 规避 location 内部的 if ( $request_uri ~* ^/get/ ) 逻辑
map $request_uri $get_expires {
    ~*^/get/    max;
    default     -1s;
}

server {
    listen 80;
    listen 443 ssl;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;
    http2 on;
    server_name _;

    ssl_certificate     /data/books/ssl/ssl.crt;
    ssl_certificate_key /data/books/ssl/ssl.key;

    index index.html;
    client_max_body_size 0;
    root /var/www/mybooks/app/dist/;
    access_log  /data/log/nginx/mybooks-access.log;
    error_log   /data/log/nginx/mybooks-error.log;

    # 兼容 /opds 和 /opds/ 两种访问方式（安全，未带问号和未命名变量）
    location = /opds {
        rewrite ^ /opds/ last;
    }

    # WebDAV 服务
    location /books {
        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header Overwrite $http_overwrite;
        proxy_set_header Range $http_range;
        proxy_pass_request_headers on;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        expires -1s;
    }

    location /podcast {
        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        expires -1s;
    }

    location /wap {
        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        expires -1s;
    }

    # /api/book/<id>/filepath（内嵌阅读器用 bookId+format 查询书籍物理路径
    location ~ ^/api/book/[0-9]+/filepath$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /api/user/whoami（内嵌阅读器的身份桥接端点，见 §5.3）没有单独限制来源——
    # 它只是把请求带的 cookie 解析成身份信息返回，不带 cookie 时直接 user.need_login，
    # 不构成"任意查询他人身份"的探测接口；拿到的信息不超过一个已经持有该 cookie
    # 的调用方本来就能拿到的（直接拿这个 cookie 调其它接口效果一样），所以跟随下面的
    # 通配规则一起代理给 Tornado 即可，不需要额外的 IP 限制。

    # MyReader（内嵌阅读器），见 document/MyReader_Embedded_WebApp.md（myreader 仓库）。
    # 只代理阅读入口实际用到的路径，不接管 MyReader 自己的书架/OPDS/分享等页面——
    # 那些路径在这套合并部署里仍然属于 MyBooks（例如 /opds 已经被下面的通配规则
    # 占用），内嵌阅读流程也从不跳转到那些页面。
    #
    # /api/mybooks/ 需要 `^~` 前缀匹配，让它在 nginx 的匹配优先级上盖过下面的
    # ^/(api|get|read|opds|auth)/ 正则（否则 /api/mybooks/whoami 这类路径会被
    # 正则规则截走，代理到 tornado 而不是 myreader）。
    location ^~ /api/mybooks/ {
        proxy_pass       http://myreader;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Standard reverse-proxy hints for the origin the browser actually
        # used (LAN IP, external domain, any port) — defense-in-depth for any
        # future MyReader server-side code that needs it before client JS
        # runs (see document/MyReader_Embedded_WebApp.md §14.2).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $req_scheme;
    }

    # 阅读入口页面 + Next.js 静态资源。这条正则必须排在下面的
    # ^/(api|get|read|opds|auth)/ 之前——nginx 对同类正则 location 按文件内
    # 先后顺序取第一个匹配，不是按最长匹配。（"reader"/"myreader" 和
    # "read" 不会互相匹配，所以两条规则本身并不冲突，这里的顺序只是防御性的。）
    location ~ ^/(readerx|reader|_next|assets|fonts|images|locales|vendor)/ {
        proxy_pass       http://myreader;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Standard reverse-proxy hints for the origin the browser actually
        # used (LAN IP, external domain, any port) — defense-in-depth for any
        # future MyReader server-side code that needs it before client JS
        # runs (see document/MyReader_Embedded_WebApp.md §14.2).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $req_scheme;
    }

    # MyReader 的根级静态文件（app/public 下未归到上面几个子目录的部分）。
    location ~ ^/(icon|icon-tiny|apple-touch-icon|favicon|manifest)\.(png|ico|json)$ {
        proxy_pass       http://myreader;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Standard reverse-proxy hints for the origin the browser actually
        # used (LAN IP, external domain, any port) — defense-in-depth for any
        # future MyReader server-side code that needs it before client JS
        # runs (see document/MyReader_Embedded_WebApp.md §14.2).
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $req_scheme;
    }

    location ~ ^/(api|get|read|opds|auth)/ {
        expires $get_expires;

        proxy_pass       http://tornado;
        proxy_redirect   off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $req_scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Redirect Kindle browsers to the WAP interface
    location = / {
        if ($http_user_agent ~* "kindle") {
            rewrite ^ /wap last;
        }
        expires -1s;
        try_files $uri /index.html;
    }

    location = /index.html {
        expires -1s;
    }
    try_files $uri $uri/index.html /index.html;
}
