[group:mybooks]
programs=tornado,nginx,logrotate,myreader

[program:tornado]
command=gosu mybooks:mybooks python3 server.py --with-library=/data/books/library --port=8000 --host=127.0.0.1 --logging=info --log-file-prefix=/data/log/mybooks.log
directory=/var/www/mybooks
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:nginx]
command = /usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=unexpected

[program:logrotate]
command=/bin/sh -c 'while true; do sleep 86400; logrotate -s /data/log/logrotate.status /etc/logrotate.d/mybooks-nginx; done'
autorestart=true

[program:myreader]
command=gosu mybooks:mybooks node app/server.js
directory=/var/www/myreader
# MYBOOKS_INTERNAL_ORIGIN: where MyReader's server-side whoami proxy
# (pages/api/mybooks/whoami.ts) reaches Tornado directly, bypassing nginx.
# Must NOT be derived from the browser's Host header on the MyReader side —
# when the container is reached through a published/mapped port (e.g.
# `docker run -p 8082:80`), that port means nothing inside the container's
# own network namespace, and reusing it there causes ECONNREFUSED/502.
environment=PORT="9100",HOSTNAME="127.0.0.1",MYBOOKS_INTERNAL_ORIGIN="http://127.0.0.1:8000"
autorestart=true
redirect_stderr=true
stdout_logfile=/data/log/myreader.log
